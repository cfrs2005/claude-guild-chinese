name: Build and Deploy Jekyll site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build

      - name: Modify CSS for purple links
        run: |
          # 在生成的CSS文件中添加紫色链接样式
          CSS_FILE="_site/assets/css/jekyll-theme-chirpy.css"
          if [ -f "$CSS_FILE" ]; then
            # 在CSS文件末尾添加紫色链接样式
            echo "
/* Claude Code 周刊 - 紫色链接样式 */
:root {
  --link-color: #7c3aed !important;
}

a:not(.btn):not(.tag):not(.img-link) {
  color: #7c3aed !important;
}

a:not(.btn):not(.tag):not(.img-link):hover {
  color: #6d28d9 !important;
}" >> "$CSS_FILE"
            echo "紫色链接样式已添加到 $CSS_FILE"
          else
            echo "CSS文件不存在: $CSS_FILE"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4